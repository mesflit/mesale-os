# Keep documentation and unused cursor variants off the system. Licences stay.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/help/*
path-exclude=/usr/share/gtk-doc/*
# Bibata's postinst registers every variant's theme file, so only the images go.
path-exclude=/usr/share/icons/Bibata-*/cursors/*
path-include=/usr/share/icons/Bibata-Modern-Ice/*
