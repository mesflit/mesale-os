defaultGroups: [ cdrom, sudo, audio, dip, video, plugdev, netdev, bluetooth ]
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements: { nonempty: true }
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user: { shell: /bin/bash, forbidden_names: [ root, mesale ] }
hostname: { location: EtcFile, writeHostsFile: true, template: "mesale" }
