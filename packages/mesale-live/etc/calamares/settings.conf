modules-search: [ local, /usr/lib/calamares/modules ]
instances:
- id: look
  module: packagechooser
  config: packagechooser_look.conf
sequence:
- show: [ welcome, locale, keyboard, partition, users, netinstall, packagechooser@look, summary ]
- exec: [ partition, mount, unpackfs, luksbootkeyfile, machineid, fstab, locale, keyboard, localecfg, users, displaymanager, networkcfg, hwclock, mesale, initramfscfg, initramfs, grubcfg, bootloader, umount ]
- show: [ finished ]
branding: mesale
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
