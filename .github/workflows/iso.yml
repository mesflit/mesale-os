name: ISO
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "website/**", "nix/website.nix", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iso
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check
        run: nix flake check -L
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          build=$(nix build --no-link --print-out-paths .#build)
          sudo MESALE_BUILD=/mnt/mesale ZSTD=19 "$build/bin/mesale-build" 2>&1 | tee build.log |
            grep -vE '^(Get:|Selecting|Preparing|Unpacking|Setting up|\(Reading)'
      - name: Publish the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Built from %s\n\n```\n%s\n```\n' "$GITHUB_SHA" "$(cat out/versions.txt)" >notes.md
          # Update in place and retry, so a GitHub hiccup never leaves the site without a download.
          retry() { for wait in 10 30 60 120 0; do "$@" && return; sleep "$wait"; done; return 1; }
          if ! gh release view dev >/dev/null 2>&1; then
            retry gh release create dev --prerelease --target "$GITHUB_SHA" --title "Mesale OS (development build)" --notes-file notes.md
          fi
          retry gh release upload dev --clobber out/*.iso out/*.sha256 out/versions.txt out/packages.txt
          retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
          retry gh release edit dev --prerelease --notes-file notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7
