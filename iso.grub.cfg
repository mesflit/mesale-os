if loadfont unicode; then set gfxmode=auto; insmod all_video; insmod gfxterm; terminal_output gfxterm; fi
insmod png
background_image /boot/grub/mesale.png
set color_normal=white/black
set color_highlight=light-cyan/black
set timeout=8
set P="boot=live components quiet splash loglevel=3 username=mesale user-fullname=Mesale hostname=mesale"
menuentry "Mesale OS - Try / Install" { linux /live/vmlinuz $P locales=en_US.UTF-8; initrd /live/initrd.img }
menuentry "Mesale OS - Safe graphics" { linux /live/vmlinuz $P locales=en_US.UTF-8 nomodeset; initrd /live/initrd.img }
menuentry "Mesale OS - Copy to RAM" { linux /live/vmlinuz $P locales=en_US.UTF-8 toram; initrd /live/initrd.img }
